<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="40%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="hazardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad)"/>
  <ellipse cx="400" cy="710" rx="230" ry="24" fill="url(#shadowGrad)"/>

  <!-- Pouch / Bag Package -->
  <g transform="translate(240, 140)">
    <!-- Main Pouch Silhouette -->
    <path d="M 30 20 C 130 10, 190 10, 290 20 L 310 520 C 310 540, 290 550, 160 550 C 30 550, 10 540, 10 520 Z" fill="url(#packGrad)" stroke="#7e22ce" stroke-width="3"/>
    
    <!-- Top Seal Crimping -->
    <rect x="25" y="8" width="270" height="24" rx="4" fill="#6b21a8"/>
    <line x1="30" y1="20" x2="290" y2="20" stroke="#f472b6" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Shiny Foil Highlights -->
    <path d="M 40 40 L 40 500 C 40 515, 60 520, 80 520 L 80 40 Z" fill="#ffffff" opacity="0.12"/>
    <path d="M 270 40 L 270 500 C 270 515, 250 520, 230 520 L 230 40 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Brand Header -->
    <rect x="70" y="55" width="180" height="34" rx="6" fill="#ffffff"/>
    <text x="160" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#9333ea" text-anchor="middle" letter-spacing="1.5">BARNETTS</text>

    <!-- Extreme Warning / Hazard Banner -->
    <g transform="translate(30, 110)">
      <polygon points="0,0 260,0 250,55 10,55" fill="url(#hazardGrad)" stroke="#ca8a04" stroke-width="2"/>
      <text x="130" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">EXTREME CHALLENGE</text>
      <text x="130" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">MEGA SOUR</text>
    </g>

    <!-- Flavor Title Banner -->
    <text x="160" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">FRUITS</text>
    <text x="160" y="240" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">INTENSE 20-SECOND RUSH!</text>

    <!-- Clear Window / Candy Graphic Preview -->
    <ellipse cx="160" cy="325" rx="85" ry="60" fill="#ffffff" opacity="0.95" stroke="#fef08a" stroke-width="3"/>
    
    <!-- Hard Boiled Sweets Illustration -->
    <!-- Sweet 1: Lime -->
    <circle cx="130" cy="315" r="26" fill="#84cc16" stroke="#4d7c0f" stroke-width="2"/>
    <circle cx="125" cy="310" r="22" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <!-- Sour Crystals -->
    <circle cx="128" cy="318" r="2" fill="#ffffff"/>
    <circle cx="135" cy="312" r="2" fill="#ffffff"/>
    <circle cx="120" cy="310" r="1.5" fill="#ffffff"/>

    <!-- Sweet 2: Cherry/Berry -->
    <circle cx="185" cy="325" r="26" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
    <circle cx="180" cy="320" r="22" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <circle cx="182" cy="328" r="2" fill="#ffffff"/>
    <circle cx="190" cy="322" r="2" fill="#ffffff"/>

    <!-- Sweet 3: Orange -->
    <circle cx="155" cy="345" r="24" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <circle cx="152" cy="342" r="20" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>

    <!-- Bottom Specs Pill -->
    <rect x="50" y="420" width="220" height="34" rx="8" fill="#581c87"/>
    <text x="160" y="442" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">NET WEIGHT 104g (3.66 oz)</text>

    <text x="160" y="480" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fdf4ff" text-anchor="middle">Gluten Free • Vegetarian • Halal</text>
    <text x="160" y="498" font-family="Inter, sans-serif" font-size="10" fill="#fae8ff" text-anchor="middle">Made in United Kingdom (Copper Pan)</text>
  </g>

  <!-- Product Badge -->
  <rect x="40" y="40" width="160" height="34" rx="17" fill="#7e22ce" opacity="0.95"/>
  <text x="120" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PACKAGING FRONT</text>
</svg>
