<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubblePackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad)"/>
  <ellipse cx="400" cy="710" rx="230" ry="24" fill="url(#shadowGrad)"/>

  <!-- Pouch / Bag Package -->
  <g transform="translate(240, 140)">
    <path d="M 30 20 C 130 10, 190 10, 290 20 L 310 520 C 310 540, 290 550, 160 550 C 30 550, 10 540, 10 520 Z" fill="url(#bubblePackGrad)" stroke="#1d4ed8" stroke-width="3"/>
    
    <!-- Top Seal Crimping -->
    <rect x="25" y="8" width="270" height="24" rx="4" fill="#1e40af"/>
    <line x1="30" y1="20" x2="290" y2="20" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Foil reflection -->
    <path d="M 40 40 L 40 500 C 40 515, 60 520, 80 520 L 80 40 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Brand Header -->
    <rect x="70" y="55" width="180" height="34" rx="6" fill="#ffffff"/>
    <text x="160" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#1e40af" text-anchor="middle" letter-spacing="1.5">BARNETTS</text>

    <!-- Hazard Tag -->
    <g transform="translate(30, 110)">
      <polygon points="0,0 260,0 250,55 10,55" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
      <text x="130" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">EXTREME CHALLENGE</text>
      <text x="130" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#be185d" text-anchor="middle">MEGA SOUR</text>
    </g>

    <!-- Flavor Title Banner -->
    <text x="160" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BUBBLEGUM</text>
    <text x="160" y="240" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">SWEET NOSTALGIA MEETS EXTREME SOUR</text>

    <!-- Window -->
    <ellipse cx="160" cy="325" rx="85" ry="60" fill="#ffffff" opacity="0.95" stroke="#fbcfe8" stroke-width="3"/>
    
    <!-- Bubblegum Sweets (Bright Blue & Pinkish Violet) -->
    <circle cx="130" cy="325" r="28" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <circle cx="125" cy="318" r="22" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <!-- Sour powder specs -->
    <circle cx="126" cy="326" r="2" fill="#ffffff"/>
    <circle cx="134" cy="330" r="1.5" fill="#ffffff"/>

    <circle cx="185" cy="325" r="28" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
    <circle cx="180" cy="318" r="22" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <circle cx="182" cy="324" r="2" fill="#ffffff"/>

    <!-- Bottom Specs Pill -->
    <rect x="50" y="420" width="220" height="34" rx="8" fill="#1e3a8a"/>
    <text x="160" y="442" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">NET WEIGHT 104g (3.66 oz)</text>

    <text x="160" y="480" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fdf4ff" text-anchor="middle">Gluten Free • Vegetarian Friendly</text>
    <text x="160" y="498" font-family="Inter, sans-serif" font-size="10" fill="#e0f2fe" text-anchor="middle">Handmade Copper Kettle Hard Candy</text>
  </g>

  <rect x="40" y="40" width="160" height="34" rx="17" fill="#0284c7" opacity="0.95"/>
  <text x="120" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PACKAGING FRONT</text>
</svg>
