<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <rect x="40" y="40" width="170" height="34" rx="17" fill="#6b21a8"/>
  <text x="125" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">UK CRAFTSMANSHIP</text>

  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="600" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="300" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">Traditional Copper Pan Heritage</text>
    <text x="300" y="85" font-family="Inter, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Barnett Confectioners Ltd. • Nottinghamshire, UK</text>

    <!-- 3 Pillars -->
    <g transform="translate(50, 125)">
      <!-- Pillar 1 -->
      <rect x="0" y="0" width="500" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="50" cy="55" r="28" fill="#d97706"/>
      <text x="50" y="61" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">COPPER</text>
      <text x="100" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Open Copper Boiling Pans</text>
      <text x="100" y="72" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Cooked over open fire to ensure deep caramelization and authentic texture.</text>

      <!-- Pillar 2 -->
      <rect x="0" y="130" width="500" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="50" cy="185" r="28" fill="#2563eb"/>
      <text x="50" y="191" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ORIGIN</text>
      <text x="100" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold" fill="#0f172a">100% British Manufacturing</text>
      <text x="100" y="202" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Manufactured adhering to strict British confectionery purity standards.</text>

      <!-- Pillar 3 -->
      <rect x="0" y="260" width="500" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="50" cy="315" r="28" fill="#16a34a"/>
      <text x="50" y="321" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SAFE</text>
      <text x="100" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Clean Recipe &amp; Allergen Control</text>
      <text x="100" y="332" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Free from gluten, soy, and gelatin; vegetarian and Halal compliant.</text>
    </g>

    <text x="300" y="525" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0284c7" text-anchor="middle">ASIN: B08P5MQQ6W • Official Amazon Marketplace Import</text>
  </g>
</svg>
