<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad)"/>
  <ellipse cx="400" cy="710" rx="220" ry="22" fill="url(#shadowGrad)"/>

  <!-- Toothpaste Tube Graphic -->
  <g transform="translate(270, 110)">
    <!-- Cap at Bottom (Standing on Cap) -->
    <rect x="70" y="520" width="120" height="50" rx="8" fill="#0f172a"/>
    <rect x="75" y="525" width="110" height="6" rx="3" fill="#334155"/>
    <rect x="75" y="540" width="110" height="4" rx="2" fill="#334155"/>

    <!-- Neck Connector -->
    <rect x="90" y="495" width="80" height="25" fill="#e2e8f0"/>

    <!-- Main Tube Body (Tapering to Crimp at Top) -->
    <path d="M 40 40 L 220 40 L 210 495 L 50 495 Z" fill="url(#tubeGrad)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Top Crimped Seal -->
    <rect x="35" y="20" width="190" height="24" rx="4" fill="#cbd5e1"/>
    <line x1="40" y1="32" x2="220" y2="32" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Tube Branding & Graphics -->
    <!-- Brand Banner -->
    <text x="130" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">ZION HEALTH</text>
    <text x="130" y="105" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="1">ADAMA MINERALS</text>

    <!-- Green Graphic Leaf / Clay Ribbon -->
    <rect x="40" y="125" width="180" height="36" fill="url(#greenAccent)"/>
    <text x="130" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">CLAYBRITE</text>

    <!-- Sub-heading -->
    <text x="130" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#059669" text-anchor="middle">SENSITIVE</text>
    <text x="130" y="205" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">MAXIMUM RELIEF</text>

    <line x1="60" y1="220" x2="200" y2="220" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Key Ingredients List -->
    <text x="130" y="245" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">• White Kaolin Clay •</text>
    <text x="130" y="265" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">• Montmorillonite Minerals •</text>
    <text x="130" y="285" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">• Green Tea Extract •</text>
    <text x="130" y="305" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">• Baking Soda •</text>

    <!-- Natural Toothpaste Emblem -->
    <circle cx="130" cy="360" r="32" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="130" y="356" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#065f46" text-anchor="middle">FLUORIDE</text>
    <text x="130" y="370" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#065f46" text-anchor="middle">FREE</text>

    <!-- Bottom Specs Pill -->
    <rect x="55" y="420" width="150" height="26" rx="6" fill="#0f172a"/>
    <text x="130" y="437" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">NET WT 4 OZ (113g)</text>

    <text x="130" y="475" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Vegan • Cruelty-Free • Non-SLS</text>
  </g>

  <rect x="40" y="40" width="160" height="34" rx="17" fill="#059669" opacity="0.95"/>
  <text x="120" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PRODUCT VIEW</text>
</svg>
