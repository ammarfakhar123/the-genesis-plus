<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <rect x="40" y="40" width="180" height="34" rx="17" fill="#1e40af"/>
  <text x="130" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PRODUCT DATA</text>

  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="600" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="300" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">Product Verification &amp; Standards</text>
    <text x="300" y="85" font-family="Inter, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Verified Amazon Inventory Data</text>

    <!-- Table Layout -->
    <g transform="translate(50, 120)">
      <rect x="0" y="0" width="500" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="25" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#334155">ASIN Identifier</text>
      <text x="475" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0284c7" text-anchor="end">B0F1G8THVZ</text>

      <rect x="0" y="65" width="500" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="25" y="97" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#334155">Net Weight</text>
      <text x="475" y="97" font-family="Inter, sans-serif" font-size="14" fill="#0f172a" text-anchor="end">104g / 3.66 oz</text>

      <rect x="0" y="130" width="500" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="25" y="162" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#334155">Brand</text>
      <text x="475" y="162" font-family="Inter, sans-serif" font-size="14" fill="#0f172a" text-anchor="end">Barnetts Confectioners Ltd.</text>

      <rect x="0" y="195" width="500" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="25" y="227" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#334155">Manufacture Method</text>
      <text x="475" y="227" font-family="Inter, sans-serif" font-size="14" fill="#0f172a" text-anchor="end">Traditional Open Copper Pan</text>

      <rect x="0" y="260" width="500" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="25" y="292" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#334155">Dietary Profile</text>
      <text x="475" y="292" font-family="Inter, sans-serif" font-size="14" fill="#16a34a" text-anchor="end">Gluten Free, Vegetarian</text>

      <rect x="0" y="325" width="500" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="25" y="357" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#334155">Country of Origin</text>
      <text x="475" y="357" font-family="Inter, sans-serif" font-size="14" fill="#0f172a" text-anchor="end">United Kingdom</text>
    </g>

    <text x="300" y="535" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Order fulfillment and shipping handled securely via Amazon</text>
  </g>
</svg>
