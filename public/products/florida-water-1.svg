<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Studio Surface Grid / Pedestal -->
  <ellipse cx="400" cy="710" rx="240" ry="24" fill="url(#shadowGrad)"/>

  <!-- Bottle Neck & Cap -->
  <g transform="translate(0, -10)">
    <!-- Cap -->
    <rect x="360" y="110" width="80" height="55" rx="6" fill="url(#capGrad)"/>
    <line x1="365" y1="125" x2="435" y2="125" stroke="#60a5fa" stroke-width="2"/>
    <line x1="365" y1="140" x2="435" y2="140" stroke="#60a5fa" stroke-width="2"/>
    
    <!-- Neck -->
    <path d="M 368 165 L 368 250 C 368 310, 310 350, 310 400 L 310 680 C 310 705, 330 715, 400 715 C 470 715, 490 705, 490 680 L 490 400 C 490 350, 432 310, 432 250 L 432 165 Z" fill="url(#glassGrad)" stroke="#0284c7" stroke-width="2"/>

    <!-- Specular Highlight on Glass -->
    <path d="M 325 410 L 325 675 C 325 685, 335 690, 345 690 L 345 405 C 345 365, 375 320, 375 250 L 375 180" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

    <!-- Vintage Florida Water Label -->
    <g transform="translate(325, 410)">
      <rect x="0" y="0" width="150" height="230" rx="8" fill="url(#labelGrad)" stroke="#b45309" stroke-width="3"/>
      <!-- Label Decorative Inner Border -->
      <rect x="6" y="6" width="138" height="218" rx="5" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="4,2"/>
      
      <!-- Seal / Header -->
      <circle cx="75" cy="40" r="22" fill="#b91c1c" stroke="#fbbf24" stroke-width="2"/>
      <text x="75" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1808</text>

      <text x="75" y="80" font-family="'Plus Jakarta Sans', serif" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle" letter-spacing="1">ORIGINAL</text>
      <text x="75" y="105" font-family="'Plus Jakarta Sans', serif" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">FLORIDA</text>
      <text x="75" y="125" font-family="'Plus Jakarta Sans', serif" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">WATER</text>

      <line x1="25" y1="135" x2="125" y2="135" stroke="#b45309" stroke-width="1"/>

      <text x="75" y="152" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#92400e" text-anchor="middle">MURRAY &amp; LANMAN</text>
      <text x="75" y="166" font-family="Inter, sans-serif" font-size="8" fill="#451a03" text-anchor="middle">NEW YORK, USA</text>

      <!-- Floral Flourish -->
      <path d="M 50 180 Q 75 174 100 180 Q 75 186 50 180 Z" fill="#15803d"/>
      <circle cx="75" cy="180" r="4" fill="#ef4444"/>

      <!-- Volume Tag -->
      <rect x="25" y="195" width="100" height="20" rx="4" fill="#1e3a8a"/>
      <text x="75" y="209" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">7.5 FL OZ (221 mL)</text>
    </g>
  </g>

  <!-- Product Badge -->
  <rect x="40" y="40" width="160" height="34" rx="17" fill="#0284c7" opacity="0.95"/>
  <text x="120" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AUTHENTIC BOTTLE</text>
</svg>
