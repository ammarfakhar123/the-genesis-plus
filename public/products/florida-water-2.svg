<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <rect x="40" y="40" width="180" height="34" rx="17" fill="#0369a1"/>
  <text x="130" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FRAGRANCE PROFILE</text>

  <!-- Big Central Focus Card -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="600" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.06))"/>
    
    <text x="300" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">Botanical &amp; Scent Architecture</text>
    <text x="300" y="90" font-family="Inter, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Murray &amp; Lanman Formula Since 1808</text>

    <!-- Top Notes -->
    <g transform="translate(50, 130)">
      <rect x="0" y="0" width="500" height="100" rx="10" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
      <text x="30" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#854d0e">Top Notes: Citrus Spark</text>
      <text x="30" y="70" font-family="Inter, sans-serif" font-size="14" fill="#713f12">Sweet Florida Orange • Fresh Bergamot • Tangy Sicilian Lemon</text>
    </g>

    <!-- Heart Notes -->
    <g transform="translate(50, 250)">
      <rect x="0" y="0" width="500" height="100" rx="10" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/>
      <text x="30" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#6b21a8">Heart Notes: Floral Bloom</text>
      <text x="30" y="70" font-family="Inter, sans-serif" font-size="14" fill="#581c87">French Lavender • Neroli Petals • Subtle Rose Essence</text>
    </g>

    <!-- Base Notes -->
    <g transform="translate(50, 370)">
      <rect x="0" y="0" width="500" height="100" rx="10" fill="#ffedd5" stroke="#fed7aa" stroke-width="1.5"/>
      <text x="30" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#9a3412">Base Notes: Herbal &amp; Warm Spice</text>
      <text x="30" y="70" font-family="Inter, sans-serif" font-size="14" fill="#7c2d12">Madagascar Clove • Warm Cinnamon Bark • Aromatic Botanicals</text>
    </g>

    <text x="300" y="525" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#0284c7" text-anchor="middle">ASIN: B0039L0FI4 • Lanman &amp; Kemp-Barclay Authentic Product</text>
  </g>
</svg>
