<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <rect x="40" y="40" width="180" height="34" rx="17" fill="#0284c7"/>
  <text x="130" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TASTE PROFILE</text>

  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="600" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="300" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">Mega Sour Bubblegum Flavor Profile</text>
    <text x="300" y="85" font-family="Inter, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">ASIN: B0F1G8THVZ • 104g Package Detail</text>

    <!-- Visual Card 1 -->
    <g transform="translate(50, 130)">
      <rect x="0" y="0" width="500" height="150" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <circle cx="65" cy="75" r="35" fill="#0284c7"/>
      <text x="65" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">SOUR</text>
      
      <text x="125" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#1e40af">Extreme Sour Dusting</text>
      <text x="125" y="80" font-family="Inter, sans-serif" font-size="14" fill="#1e3a8a">
        <tspan x="125" dy="0">High-potency crystalline coating triggers immediate salivary</tspan>
        <tspan x="125" dy="22">stimulation, testing your sour tolerance for up to 20 seconds.</tspan>
      </text>
    </g>

    <!-- Visual Card 2 -->
    <g transform="translate(50, 310)">
      <rect x="0" y="0" width="500" height="150" rx="12" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
      <circle cx="65" cy="75" r="35" fill="#db2777"/>
      <text x="65" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">SWEET</text>
      
      <text x="125" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#9d174d">Juicy Bubblegum Core</text>
      <text x="125" y="80" font-family="Inter, sans-serif" font-size="14" fill="#831843">
        <tspan x="125" dy="0">A smooth, long-lasting hard candy core rich with nostalgic</tspan>
        <tspan x="125" dy="22">confectionery bubblegum sweetness and aromatic berries.</tspan>
      </text>
    </g>

    <text x="300" y="525" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Gluten Free • Gelatin Free • Vegetarian Compliant</text>
  </g>
</svg>
