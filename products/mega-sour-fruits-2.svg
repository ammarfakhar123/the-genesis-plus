<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <rect x="40" y="40" width="180" height="34" rx="17" fill="#9333ea"/>
  <text x="130" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">THE SOUR PROCESS</text>

  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="600" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="300" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">The 2-Phase Extreme Taste Journey</text>
    <text x="300" y="85" font-family="Inter, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">What makes Barnetts Mega Sour world-famous</text>

    <!-- Phase 1 -->
    <g transform="translate(50, 130)">
      <rect x="0" y="0" width="500" height="150" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
      <circle cx="65" cy="75" r="35" fill="#f43f5e"/>
      <text x="65" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">0-20s</text>
      
      <text x="125" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#be123c">Phase 1: Ultra-Acidic Outer Shell</text>
      <text x="125" y="80" font-family="Inter, sans-serif" font-size="14" fill="#881337">
        <tspan x="125" dy="0">Dusted with an intense proprietary malic/citric blend</tspan>
        <tspan x="125" dy="22">that challenges even seasoned sour candy enthusiasts.</tspan>
      </text>
    </g>

    <!-- Phase 2 -->
    <g transform="translate(50, 310)">
      <rect x="0" y="0" width="500" height="150" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <circle cx="65" cy="75" r="35" fill="#16a34a"/>
      <text x="65" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">20s+</text>
      
      <text x="125" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#15803d">Phase 2: Sweet Traditional Fruit Core</text>
      <text x="125" y="80" font-family="Inter, sans-serif" font-size="14" fill="#14532d">
        <tspan x="125" dy="0">Once the coating melts, discover mouth-watering sweet</tspan>
        <tspan x="125" dy="22">copper-pan boiled fruit flavors that reward your endurance.</tspan>
      </text>
    </g>

    <text x="300" y="525" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Dietary: Gluten-Free • Halal Certified • Vegetarian Friendly</text>
  </g>
</svg>
