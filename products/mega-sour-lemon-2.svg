<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <rect x="40" y="40" width="180" height="34" rx="17" fill="#ca8a04"/>
  <text x="130" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">LEMON HIGHLIGHTS</text>

  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="600" height="580" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="300" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">Barnetts Flagship Sour Lemon</text>
    <text x="300" y="85" font-family="Inter, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">The benchmark for authentic British extreme confectionery</text>

    <g transform="translate(50, 130)">
      <rect x="0" y="0" width="500" height="150" rx="12" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
      <circle cx="65" cy="75" r="35" fill="#eab308"/>
      <text x="65" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">1/2 LB</text>
      
      <text x="125" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#854d0e">Generous 227g Half-Pound Size</text>
      <text x="125" y="80" font-family="Inter, sans-serif" font-size="14" fill="#713f12">
        <tspan x="125" dy="0">Twice the volume of standard 104g bags. Perfect for</tspan>
        <tspan x="125" dy="22">group challenges, parties, and dedicated sour confection fans.</tspan>
      </text>
    </g>

    <g transform="translate(50, 310)">
      <rect x="0" y="0" width="500" height="150" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
      <circle cx="65" cy="75" r="35" fill="#059669"/>
      <text x="65" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">ZEST</text>
      
      <text x="125" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#065f46">Authentic Natural Citrus Zest</text>
      <text x="125" y="80" font-family="Inter, sans-serif" font-size="14" fill="#064e3b">
        <tspan x="125" dy="0">Features real lemon oils boiled directly in copper kettles to</tspan>
        <tspan x="125" dy="22">deliver a crisp, clean citrus finish without chemical aftertaste.</tspan>
      </text>
    </g>

    <text x="300" y="525" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">ASIN: B00BEW83ZW • Verified Amazon Direct Link</text>
  </g>
</svg>
