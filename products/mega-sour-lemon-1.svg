<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lemonPackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad)"/>
  <ellipse cx="400" cy="710" rx="240" ry="24" fill="url(#shadowGrad)"/>

  <!-- Pouch / Large 227g Bag Package -->
  <g transform="translate(230, 130)">
    <path d="M 30 20 C 140 8, 200 8, 310 20 L 330 540 C 330 560, 310 570, 170 570 C 30 570, 10 560, 10 540 Z" fill="url(#lemonPackGrad)" stroke="#a16207" stroke-width="3"/>
    
    <!-- Top Seal Crimping -->
    <rect x="25" y="8" width="290" height="24" rx="4" fill="#854d0e"/>
    <line x1="30" y1="20" x2="310" y2="20" stroke="#fef08a" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Foil highlight -->
    <path d="M 40 40 L 40 520 C 40 535, 60 540, 80 540 L 80 40 Z" fill="#ffffff" opacity="0.18"/>

    <!-- Brand Header -->
    <rect x="75" y="55" width="190" height="34" rx="6" fill="#ffffff"/>
    <text x="170" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#a16207" text-anchor="middle" letter-spacing="1.5">BARNETTS</text>

    <!-- Hazard Tag -->
    <g transform="translate(35, 110)">
      <polygon points="0,0 270,0 260,55 10,55" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
      <text x="135" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">FLAGSHIP FORMULA</text>
      <text x="135" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#b45309" text-anchor="middle">MEGA SOUR</text>
    </g>

    <!-- Title Banner -->
    <text x="170" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">LEMON</text>
    <text x="170" y="240" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">THE ORIGINAL MOUTH-PUCKERING KING</text>

    <!-- Window -->
    <ellipse cx="170" cy="335" rx="90" ry="65" fill="#ffffff" opacity="0.95" stroke="#fef08a" stroke-width="3"/>
    
    <!-- Lemon Boiled Sweets -->
    <circle cx="140" cy="330" r="30" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="134" cy="322" r="24" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <circle cx="135" cy="330" r="2" fill="#ffffff"/>
    <circle cx="145" cy="334" r="1.5" fill="#ffffff"/>

    <circle cx="200" cy="340" r="30" fill="#fef08a" stroke="#eab308" stroke-width="2"/>
    <circle cx="194" cy="332" r="24" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <circle cx="198" cy="338" r="2" fill="#ffffff"/>

    <!-- Bottom Specs Pill (Half-Pound Emphasis) -->
    <rect x="45" y="435" width="250" height="36" rx="8" fill="#713f12"/>
    <text x="170" y="458" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">227g (8 oz / HALF POUND)</text>

    <text x="170" y="500" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fefce8" text-anchor="middle">Gluten Free • Soy Free • Halal • Vegetarian</text>
    <text x="170" y="520" font-family="Inter, sans-serif" font-size="10" fill="#fef9c3" text-anchor="middle">Handmade in Nottinghamshire, England</text>
  </g>

  <rect x="40" y="40" width="170" height="34" rx="17" fill="#ca8a04" opacity="0.95"/>
  <text x="125" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FAMILY SIZE (227g)</text>
</svg>
